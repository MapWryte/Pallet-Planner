      const overflow = z.end > state.pallet.maxHeight + 1e-6;
      const bg = overflow ? "var(--bad-soft)" : (i % 2 === 0 ? "var(--accent-soft)" : "var(--surface-3)");
      const bd = overflow ? "var(--bad)" : "var(--line-strong)";
      const tip = `${esc(l.name)}: ${fmt(parts.total, 2)}&quot; total`
        + (parts.bb ? ` (baseboard ${fmt(parts.bb, 2)}&quot; + ` : ` (`)
        + `product ${fmt(parts.product, 2)}&quot;`
        + (parts.cap ? ` + cap ${fmt(parts.cap, 2)}&quot;)` : `)`)
        + ` — z ${fmt(z.start, 1)}–${fmt(z.end, 1)}`;
      let bands = "";
      if (parts.bb) bands += `<div style="height:${Math.max((parts.bb / parts.total) * 100, 3)}%; background:var(--ink-dim); opacity:0.35;"></div>`;
      bands += `<div style="flex:1;"></div>`;
      if (parts.cap) bands += `<div style="height:${Math.max((parts.cap / parts.total) * 100, 3)}%; background:var(--ink-dim); opacity:0.35;"></div>`;
      return `<div class="stack-seg" data-select="${l.id}" style="height:${Math.max(h, 6)}px; background:${bg}; border-top-color:${bd}; flex-direction:column-reverse; display:flex; padding:0;"
        data-tip="${tip}">${bands}</div>`;
    }).join("");

    const maxPx = (state.pallet.maxHeight / scaleMax) * px;
    bar.innerHTML += `<div class="max-line" style="bottom:${maxPx}px;"><span>max ${fmt(state.pallet.maxHeight, 1)}"</span></div>`;

    bar.querySelectorAll("[data-select]").forEach(b => {
      b.onclick = () => { state.selectedId = b.getAttribute("data-select"); render(); };
    });

    const overflowed = total > state.pallet.maxHeight + 1e-6;
    const footprintArea = state.pallet.length * state.pallet.width;
    const totalItems = state.layers.reduce((s, l, i) => s + computeLayer(l, layerBounds(i)).count, 0);

    document.getElementById("stackStats").innerHTML = `
      <div class="stat-line"><span class="k">Total stack height</span>
        <span class="v ${overflowed ? "bad" : "good"}">${fmt(total, 2)}" / ${fmt(state.pallet.maxHeight, 2)}"</span></div>
      <div class="stat-line"><span class="k">Layers</span><span class="v">${state.layers.length}</span></div>
      <div class="stat-line"><span class="k">Total units placed</span><span class="v">${totalItems}</span></div>
      <div class="stat-line"><span class="k">Pallet footprint</span><span class="v">${fmt(footprintArea, 0)} in²</span></div>
      ${overflowed ? `<p class="hint" style="color:var(--bad)">Stack exceeds the configured max height — trim a layer height or raise the max.</p>` : ""}
    `;
  }

  // ---------------------------------------------------------------
  // Render: view body (single / all / unique)
  // ---------------------------------------------------------------
  function packingLabel(l) {
    if (l.packing === "tiling") return "auto tiling";
    if (l.packing === "close") return "close-packed (hex)";
    return "rectangular array";
  }

  // Footprint % is always against the layer's OWN usable bounds (shrunk by
  // any baseboard/cap-below), not the raw pallet — otherwise a layer capped
  // to a small board would read as mostly-empty even when it's packed tight.
  function utilBadge(computed) {
    const b = computed.bounds;
    const area = b ? (b.x1 - b.x0) * (b.y1 - b.y0) : state.pallet.length * state.pallet.width;
    const used = computed.count * computed.itemArea;
    const pct = area > 0 ? (used / area) * 100 : 0;
    const cls = pct >= 75 ? "good" : pct >= 50 ? "warn" : "bad";
    return `<span class="badge ${cls}">footprint used ${fmt(pct, 1)}%</span>`;
  }

  function renderSingle() {
    const layer = selectedLayer();
    if (!layer) return `<div class="empty">No layer selected</div>`;
    const idx = layerIndex(layer);
    const computed = positionedComputed(layer, idx);
    const isBottom = idx === 0;
    const myBB = effectiveBaseboard(idx);
    const bbOverride = isBottom && myBB.enabled && myBB.overridesPallet;
    const bbRect = myBB.enabled
      ? { ...boardRect(myBB, state.pallet, bbOverride), fillet: myBB.fillet } : null;
    const b = computed.bounds;
    const constrained = b && (b.x0 > 1e-6 || b.y0 > 1e-6 || b.x1 < state.pallet.length - 1e-6 || b.y1 < state.pallet.width - 1e-6);
    const overhangs = bbRect && (bbRect.x0 < -1e-6 || bbRect.y0 < -1e-6 || bbRect.x1 > state.pallet.length + 1e-6 || bbRect.y1 > state.pallet.width + 1e-6);
    const capBelow = idx > 0 ? effectiveCap(idx - 1) : null;
    const myCap = effectiveCap(idx);
    return `<div class="canvas-single">
      ${buildSVG(layer, computed, state.pallet, { big: true, baseboard: bbRect, bounds: constrained ? b : null })}
      <div class="badge-row">
        <span class="badge">${computed.count} placed</span>
        ${utilBadge(computed)}
        <span class="badge">${packingLabel(layer)}</span>
        ${myBB.enabled ? `<span class="badge">baseboard ${fmt(myBB.length, 1)}×${fmt(myBB.width, 1)}″${myBB.linkedToCapBelow ? " (linked)" : ""}</span>` : ""}
        ${myCap.enabled ? `<span class="badge">cap ${fmt(myCap.length, 1)}×${fmt(myCap.width, 1)}″${myCap.linked && myBB.enabled ? " (linked)" : ""}</span>` : ""}
        ${capBelow && capBelow.enabled ? `<span class="badge warn">bounded by cap below</span>` : ""}
        ${overhangs ? `<span class="badge warn">baseboard overhangs pallet deck</span>` : ""}
      </div>
    </div>`;
  }

  function renderAll() {
    if (!state.layers.length) return `<div class="empty">No layers yet</div>`;
    return `<div class="small-grid">${state.layers.map((l, i) => {
      const computed = positionedComputed(l, i);
      return `<div class="small-card" data-select="${l.id}">
        ${buildSVG(l, computed, state.pallet, { big: false })}
        <div class="nm">${esc(l.name)}</div>
        <div class="info">${computed.count} placed · ${l.productType}</div>
        <span class="tag">${packingLabel(l)}</span>
      </div>`;
    }).join("")}</div>`;
  }

  function renderUnique() {
    if (!state.layers.length) return `<div class="empty">No layers yet</div>`;
    const groups = [];
    const bySig = {};
    state.layers.forEach(l => {
      const sig = layerSig(l);
      if (!bySig[sig]) { bySig[sig] = { rep: l, members: [] }; groups.push(bySig[sig]); }
      bySig[sig].members.push(l);
    });
    return `<div class="small-grid">${groups.map(g => {
      const computed = positionedComputed(g.rep, layerIndex(g.rep));
      const names = g.members.map(m => m.name).join(", ");
      return `<div class="small-card" data-select="${g.rep.id}">
        ${buildSVG(g.rep, computed, state.pallet, { big: false })}
        <div class="nm">${esc(g.rep.name)}</div>
        <div class="info">${computed.count} placed · used ×${g.members.length}</div>
        <span class="tag" title="${esc(names)}">${g.members.length > 1 ? esc(names) : packingLabel(g.rep)}</span>
      </div>`;
    }).join("")}</div>`;
  }

  function renderViewBody() {
    const el = document.getElementById("viewBody");
    if (state.view === "single") el.innerHTML = renderSingle();
    else if (state.view === "all") el.innerHTML = renderAll();
    else el.innerHTML = renderUnique();

    el.querySelectorAll("[data-select]").forEach(b => {
      b.onclick = () => { state.selectedId = b.getAttribute("data-select"); state.view = "single"; render(); };
    });

    document.querySelectorAll("#viewTabs button").forEach(b => {
      b.classList.toggle("on", b.getAttribute("data-view") === state.view);
    });
  }

  // ---------------------------------------------------------------
  // Render: magic numbers (parameter sweep)
  // ---------------------------------------------------------------
  function buildStepChart(segs, currentV) {
    const w = 560, h = 150, mL = 34, mB = 20, mT = 8, mR = 8;
    const minV = segs[0].start, maxV = segs[segs.length - 1].end;
    const maxC = Math.max(...segs.map(s => s.count), 1);
    const iw = w - mL - mR, ih = h - mT - mB;
    const x = v => mL + ((v - minV) / (maxV - minV || 1)) * iw;
    const y = c => mT + ih - (c / maxC) * ih;

    let path = "";
    segs.forEach((s, i) => {
      const x1 = x(s.start), x2 = x(s.end), yy = y(s.count);
      path += (i === 0 ? `M ${x1} ${yy}` : ` L ${x1} ${yy}`) + ` L ${x2} ${yy}`;
      if (i < segs.length - 1) path += ` L ${x2} ${y(segs[i + 1].count)}`;
    });

    const curX = x(Math.min(Math.max(currentV, minV), maxV));
    return `<svg viewBox="0 0 ${w} ${h}">
      <line x1="${mL}" y1="${mT + ih}" x2="${mL + iw}" y2="${mT + ih}" stroke="var(--line-strong)" stroke-width="1"/>
      <line x1="${mL}" y1="${mT}" x2="${mL}" y2="${mT + ih}" stroke="var(--line-strong)" stroke-width="1"/>
      <text x="${mL}" y="${mT + ih + 14}" font-family="var(--font-mono)" font-size="10" fill="var(--ink-dim)">${fmt(minV, 2)}</text>
      <text x="${mL + iw}" y="${mT + ih + 14}" text-anchor="end" font-family="var(--font-mono)" font-size="10" fill="var(--ink-dim)">${fmt(maxV, 2)}</text>
      <text x="${mL - 6}" y="${mT + 4}" text-anchor="end" font-family="var(--font-mono)" font-size="10" fill="var(--ink-dim)">${maxC}</text>
      <text x="${mL - 6}" y="${mT + ih}" text-anchor="end" font-family="var(--font-mono)" font-size="10" fill="var(--ink-dim)">0</text>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <line x1="${curX}" y1="${mT}" x2="${curX}" y2="${mT + ih}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3,3"/>
    </svg>`;
  }

  function renderMagic() {
    const el = document.getElementById("magicPanel");
    const layer = selectedLayer();
    if (!layer || state.view !== "single") { el.innerHTML = ""; return; }

    const idx = layerIndex(layer);
    const bounds = layerBounds(idx);
    const isRoll = layer.productType === "roll";
    const sweepDim = isRoll ? "diameter" : state.sweepDim;
    const center = isRoll ? layer.dims.diameter : layer.dims[state.sweepDim];
    const loBoundAbs = 0.1;
    const boundsL = bounds.x1 - bounds.x0, boundsW = bounds.y1 - bounds.y0;
    const hiBoundAbs = isRoll ? Math.min(boundsL, boundsW)
                               : (state.sweepDim === "length" ? boundsL : boundsW);

    let dMin, dMax, note = "";
    if (state.magicMode === "auto") {
      const w = computeAutoWindow(layer, isRoll, sweepDim, center, loBoundAbs, hiBoundAbs, bounds);
      dMin = w.dMin; dMax = w.dMax;
      if (!w.foundUp && !w.foundDown) note = " No threshold found nearby — the count is stable across a wide range here; try a manual range to look further out.";
    } else {
      dMin = Math.max(loBoundAbs, center - state.magicMode);
      dMax = Math.min(hiBoundAbs, center + state.magicMode);
    }
    if (dMax - dMin < 0.02) dMax = dMin + 0.02;

    const { segs } = sweepAndRefine(layer, isRoll, sweepDim, dMin, dMax, 80, bounds);
    const chart = buildStepChart(segs, center);

    const curComputed = computeLayer(layer, bounds);
    const curArea = boundsL * boundsW;
    const curUtil = curArea > 0 ? (curComputed.count * curComputed.itemArea / curArea) * 100 : 0;

    const rows = segs.map(s => {
      const width = s.end - s.start;
      const isCliff = width < 0.1;
      const isCurrent = center >= s.start - 1e-6 && center <= s.end + 1e-6;
      const util = curArea > 0 ? (s.count * itemAreaAt(layer, isRoll, sweepDim, s.end) / curArea) * 100 : 0;
      return `<tr class="${isCliff ? "cliff" : ""} ${isCurrent ? "current" : ""}">
        <td>${fmt(s.start, 3)}&Prime;–${fmt(s.end, 3)}&Prime;${isCliff ? " ⚡" : ""}</td>
        <td>${s.count}</td>
        <td>${fmt(util, 1)}%</td>
      </tr>`;
    }).join("");

    el.innerHTML = `
      <div class="panel-title">
        <span>Magic numbers — ${isRoll ? "roll diameter" : "box " + state.sweepDim}</span>
        ${!isRoll ? `<div class="radio-row">
          <button data-sd="length" class="${state.sweepDim === "length" ? "on" : ""}">Sweep length</button>
          <button data-sd="width" class="${state.sweepDim === "width" ? "on" : ""}">Sweep width</button>
        </div>` : ""}
      </div>
      <div class="badge-row" style="justify-content:flex-start; margin-bottom:10px;">
        <span class="badge">packing: ${packingLabel(layer)}</span>
        <span class="badge">current: ${curComputed.count} placed</span>
        <span class="badge ${curUtil >= 75 ? "good" : curUtil >= 50 ? "warn" : "bad"}">footprint used ${fmt(curUtil, 1)}%</span>
      </div>
      <p class="hint" style="margin-bottom:10px;">
        How placed count — and the footprint it uses — changes as ${isRoll ? "roll diameter" : "box " + state.sweepDim}
        moves around the current value (${fmt(center, 3)}&Prime;).${note}
      </p>
      <div class="magic-controls">
        <div class="radio-row">
          <button data-mode="auto" class="${state.magicMode === "auto" ? "on" : ""}">Auto (to first jump)</button>
        </div>
        <div class="field" style="gap:2px;">
          <label style="font-size:0.62rem;">or manual range, ± in</label>
          <input id="magicSpan" class="inline-num" type="text" inputmode="decimal" placeholder="e.g. 1.5">
        </div>
      </div>
      <div class="chart-wrap">${chart}</div>
      <div class="table-scroll">
        <table class="brk">
          <thead><tr><th>Range</th><th>Count</th><th>Footprint used</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;

    if (!isRoll) {
      el.querySelectorAll("[data-sd]").forEach(b => {
        b.onclick = () => { state.sweepDim = b.getAttribute("data-sd"); render(); };
      });
    }
    el.querySelector('[data-mode="auto"]').onclick = () => { state.magicMode = "auto"; render(); };
    const spanEl = document.getElementById("magicSpan");
    if (typeof state.magicMode === "number") spanEl.value = fmt(state.magicMode, 2);
    spanEl.addEventListener("change", () => {
      const n = parseFloat(spanEl.value);
      if (!isNaN(n) && n > 0.02) { state.magicMode = n; render(); }
    });
  }

  // ---------------------------------------------------------------
  // Top-level buttons
  // ---------------------------------------------------------------
  function bindGlobalButtons() {
    document.getElementById("btnAddLayer").onclick = () => {
      const tmpl = selectedLayer();
      const nl = tmpl
        ? JSON.parse(JSON.stringify(tmpl))
        : { productType: "box", dims: { length: 12, width: 10, height: 8 }, packing: "grid" };
      nl.id = newId();
      nl.name = "New layer";
      state.layers.push(nl);
      state.selectedId = nl.id;
      render();
    };
    document.getElementById("btnDupLayer").onclick = () => {
      const cur = selectedLayer();
      if (!cur) return;
      const nl = JSON.parse(JSON.stringify(cur));
      nl.id = newId();
      nl.name = cur.name + " copy";
      const idx = state.layers.findIndex(l => l.id === cur.id);
      state.layers.splice(idx + 1, 0, nl);
      state.selectedId = nl.id;
      render();
    };
    document.getElementById("btnDelLayer").onclick = () => {
      if (state.layers.length <= 1) return;
      const idx = state.layers.findIndex(l => l.id === state.selectedId);
      state.layers.splice(idx, 1);
      state.selectedId = state.layers[Math.max(0, idx - 1)].id;
      render();
    };
    document.getElementById("btnMoveUp").onclick = () => {
      const idx = state.layers.findIndex(l => l.id === state.selectedId);
      if (idx >= 0 && idx < state.layers.length - 1) { [state.layers[idx + 1], state.layers[idx]] = [state.layers[idx], state.layers[idx + 1]]; render(); }
    };
    document.getElementById("btnMoveDown").onclick = () => {
      const idx = state.layers.findIndex(l => l.id === state.selectedId);
      if (idx > 0) { [state.layers[idx - 1], state.layers[idx]] = [state.layers[idx], state.layers[idx - 1]]; render(); }
    };
    document.querySelectorAll("#viewTabs button").forEach(b => {
      b.onclick = () => { state.view = b.getAttribute("data-view"); render(); };
    });
  }

  // ---------------------------------------------------------------
  // Render pipeline
  //   render()            — full rebuild, including the editor's own
  //                          input DOM nodes. Only called from discrete
  //                          clicks/selects, never while someone is typing
  //                          into a field that would itself get rebuilt.
  //   renderDependents()  — everything EXCEPT the editor panel. Used by
  //                          the editor's own numeric fields so typing a
  //                          box/roll dimension never destroys the input
  //                          the person is mid-keystroke in.
  // ---------------------------------------------------------------
  function renderDependents() {
    state.layers.forEach(ensureBoards);
    renderLayerList();
    renderStack();
    renderViewBody();
    renderMagic();
  }
  function render() {
    state.layers.forEach(ensureBoards);
    renderLayerList();
    renderEditor();
    renderStack();
    renderViewBody();
    renderMagic();
  }

  bindPalletInputs();
  bindGlobalButtons();
  render();
})();
</script>
